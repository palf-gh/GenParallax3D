[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "genparallax3d"
version = "0.1.0"
description = "Layer-aware 3D parallax reconstruction from PSD/PSB to GLB for After Effects"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pillow>=10",
    "psd-tools>=1.9",
    "PySide6>=6.6",
    "moderngl>=5.10",
    "pygltflib>=1.16",
]

[project.optional-dependencies]
ai = ["torch>=2.2", "transformers>=4.45"]
dev = ["pytest>=8"]
build = ["pyinstaller>=6.10"]

[project.scripts]
genparallax3d = "genparallax.app.main_window:main"

[tool.setuptools.packages.find]
include = ["genparallax*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
